<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTS Portal - Processing</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .processing-container {
            text-align: center;
            padding: 40px 0;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(59, 130, 246, 0.3);
            border-top: 5px solid #3b82f6;
            border-radius: 50%;
            margin: 0 auto 30px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .processing-text {
            font-size: 18px;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 30px 0;
        }
        
        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            border-radius: 3px;
            animation: progress 2s ease-in-out forwards;
        }
        
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="aura a1"></div>
    <div class="aura a2"></div>
    <div class="aura a3"></div>

    <div class="card">
        <div class="processing-container">
            <div class="spinner"></div>
            <h2>Welcome Back</h2>
            <p class="processing-text">Logging you in...</p>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Redirect to home page after processing animation
        setTimeout(function() {
            window.location.href = "home.html";
        }, 2500);
    </script>
</body>
</html>
