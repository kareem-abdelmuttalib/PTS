<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTS Portal - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .user-info {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .info-label {
            font-weight: 600;
            opacity: 0.8;
        }
        
        .info-value {
            font-weight: 700;
        }
        
        .password-masked {
            letter-spacing: 3px;
            font-family: monospace;
        }
        
        .toggle-password {
            background: rgba(59, 130, 246, 0.2);
            border: none;
            color: #3b82f6;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: all 0.3s;
        }
        
        .toggle-password:hover {
            background: rgba(59, 130, 246, 0.3);
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .dashboard-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .dashboard-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .card-icon {
            font-size: 32px;
            margin-bottom: 16px;
            opacity: 0.9;
        }
        
        .logout-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 14px;
            color: #ef4444;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 30px;
        }
        
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="aura a1"></div>
    <div class="aura a2"></div>
    <div class="aura a3"></div>

    <div class="card">
        <div class="welcome-section">
            <div class="logo">PTS</div>
            <h1>Welcome to Your Dashboard</h1>
            <p class="lead">PTS Training Portal</p>
        </div>

        <div class="user-info">
            <div class="info-row">
                <span class="info-label">Username:</span>
                <span class="info-value" id="username-display">student.pts</span>
            </div>
            <div class="info-row">
                <span class="info-label">Password:</span>
                <span class="info-value">
                    <span id="password-display" class="password-masked">••••••••</span>
                    <button class="toggle-password" id="toggle-password">Show</button>
                </span>
            </div>
            <div class="info-row">
                <span class="info-label">Status:</span>
                <span class="info-value" style="color: #10b981;">Active</span>
            </div>
            <div class="info-row">
                <span class="info-label">Program:</span>
                <span class="info-value">PTS by Eng. Karim</span>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="card-icon">📚</div>
                <h3>Courses</h3>
                <p>Access training materials</p>
            </div>
            <div class="dashboard-card">
                <div class="card-icon">🔬</div>
                <h3>Labs</h3>
                <p>Practice in virtual labs</p>
            </div>
            <div class="dashboard-card">
                <div class="card-icon">📊</div>
                <h3>Progress</h3>
                <p>Track your learning</p>
            </div>
            <div class="dashboard-card">
                <div class="card-icon">👨‍🏫</div>
                <h3>Support</h3>
                <p>Get help from instructors</p>
            </div>
        </div>

        <button class="logout-btn" onclick="window.location.href='index.html'">Log Out</button>
    </div>

    <script src="script.js"></script>
    <script>
        // Password toggle functionality
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordDisplay = document.getElementById('password-display');
            const toggleButton = document.getElementById('toggle-password');
            
            if (passwordDisplay.classList.contains('password-masked')) {
                passwordDisplay.textContent = 'pts2024secure';
                passwordDisplay.classList.remove('password-masked');
                toggleButton.textContent = 'Hide';
            } else {
                passwordDisplay.textContent = '••••••••';
                passwordDisplay.classList.add('password-masked');
                toggleButton.textContent = 'Show';
            }
        });
        
        // Set username from URL parameters if available
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');
        if (username) {
            document.getElementById('username-display').textContent = username;
        }
    </script>
</body>
</html>
